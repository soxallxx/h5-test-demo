                    tab === 'profile' && React.createElement(ProfilePage, { onDramaClick: handleDramaClick, onPurchaseClick: handlePurchaseOpen, isLoggedIn, setIsLoggedIn, isVip, setIsVip }),
                    React.createElement(BottomNav, { activeTab: tab, onTabChange: setTab, transparent: tab === 'foryou' }),
                    detail && React.createElement(DramaPlayerPage, { drama: detail, onClose: handleClose, onPurchaseClick: handlePurchaseOpen }),
                    React.createElement(PurchaseSheet, {
                        open: !!purchase,
                        drama: purchase?.drama,
                        episode: purchase?.episode,
                        source: purchase?.source,
                        intent: purchase?.intent,
                        onClose: handlePurchaseClose,
                        onPaid: handlePaid
                    })
                )
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>
